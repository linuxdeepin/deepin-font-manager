# AT-SPI expected accessible names for deepin-font-manager
# Generated by AT-SPI completion agent

application:
  name: "deepin-font-manager"
  toolkit: "DTK"
  description: "Font Manager - Install and manage fonts"

windows:
  - name: "FontManagerMainWindow"
    type: "DMainWindow"
    title: "Font Manager"
    children:
      - name: "TitleActionArea"
        type: "QWidget"
      - name: "AddFontButton"
        type: "DIconButton"
        role: "push button"
        description: "Add font files"
      - name: "SearchFontEdit"
        type: "DSearchEdit"
        role: "search box"
        description: "Search fonts"
      - name: "LeftBarHolder"
        type: "QWidget"
      - name: "LeftSideBar"
        type: "DSplitListWidget"
        role: "list"
        description: "Font category list"
      - name: "MainWindowSplitter"
        type: "DSplitter"
      - name: "FontShowArea"
        type: "QWidget"
      - name: "FontPreviewListView"
        type: "DFontPreviewListView"
        role: "list"
        description: "Font preview list"
      - name: "NoResultListView"
        type: "DListView"
        role: "list"
        description: "No search results"
      - name: "NoInstallListView"
        type: "DListView"
        role: "list"
        description: "No fonts installed"
      - name: "FontLoadingSpinner"
        type: "DFontSpinnerWidget"
      - name: "StateBarShadowLine"
        type: "DHorizontalLine"
      - name: "StateBar"
        type: "QWidget"
        children:
          - name: "TextInputEdit"
            type: "DLineEdit"
            role: "text"
            description: "Input preview text"
          - name: "FontScaleSlider"
            type: "DSlider"
            role: "slider"
            description: "Adjust font preview size"
          - name: "FontSizeLabel"
            type: "DLabel"
            role: "label"
            description: "Current font size display"

  - name: "QuickInstallWindow"
    type: "DMainWindow"
    title: "Quick Install"
    children:
      - name: "QuickInstallTitle"
        type: "DLabel"
        role: "label"
      - name: "QuickInstallFontType"
        type: "DComboBox"
        role: "combo box"
      - name: "QuickInstallFontPreview"
        type: "DFontPreviewer"
        role: "label"
      - name: "QuickInstallStateLabel"
        type: "DLabel"
        role: "label"
      - name: "QuickInstallActionButton"
        type: "DPushButton"
        role: "push button"
        description: "Install font"

  - name: "InstallNormalWindow"
    type: "DFontBaseDialog"
    title: "Install Font"
    children:
      - name: "InstallProgressStepLabel"
        type: "DLabel"
        role: "label"
      - name: "InstallCurrentFontLabel"
        type: "DTipLabel"
        role: "label"
      - name: "InstallProgressBar"
        type: "DProgressBar"
        role: "progress bar"

  - name: "InstallErrorDialog"
    type: "DDialog"
    title: "Font Verification"
    children:
      - name: "InstallErrorListView"
        type: "DFInstallErrorListView"
        role: "list"
        description: "Font verification list"

  - name: "FontInfoDialog"
    type: "DFontBaseDialog"
    title: "Font Info"
    children:
      - name: "FontInfoMainFrame"
        type: "QWidget"
      - name: "FontInfoFileName"
        type: "DLabel"
        role: "label"
      - name: "FontInfoScrollArea"
        type: "QScrollArea"
        role: "scroll pane"
        children:
          - name: "BasicInfoLabel"
            type: "DLabel"
            role: "label"
            description: "Basic info"

  - name: "DeleteConfirmDialog"
    type: "DDialog"
    title: "Delete Font"
    children:
      - name: "messageTitle"
        type: "DLabel"
        role: "label"
      - name: "DeleteMessageDetail"
        type: "DLabel"
        role: "label"

  - name: "HandleTTCDialog"
    type: "DFontBaseDialog"
    children:
      - name: "messageTitle"
        type: "DLabel"
        role: "label"
      - name: "Applyall_btn"
        type: "DCheckBox"
        role: "check box"
      - name: "TTCCancelButton"
        type: "DPushButton"
        role: "push button"
      - name: "TTCConfirmButton"
        type: "DWarningButton"
        role: "push button"

  - name: "FontSpinnerWidget"
    type: "DWidget"
    children:
      - name: "FontSpinnerAnimation"
        type: "DFontSpinner"
      - name: "FontSpinnerLabel"
        type: "QLabel"
        role: "label"
        description: "Loading fonts, please wait..."

base_dialogs:
  - name: "DialogTitleBar"
    type: "QWidget"
    description: "Title bar for DFontBaseDialog"
  - name: "DialogLogoIcon"
    type: "DLabel"
    role: "label"
  - name: "DialogTitleText"
    type: "DLabel"
    role: "label"
  - name: "DialogCloseButton"
    type: "DWindowCloseButton"
    role: "push button"
    description: "Close dialog"